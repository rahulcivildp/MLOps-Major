name: MLOps Assignment Workflow

on:
  push:
    branches:
      - dev

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.14]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Decision Tree Classifier Model
        run: |
          echo "===== Decision Tree Classifier Model ====="
          python train.py

      - name: Run test for Decision Tree Classifier Model
        run: |
          echo "===== Test Decision Tree Classifier Model ====="
          python test.py
